version: '3.9'

networks:
  secure-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: secureportal-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: "Developer"
      MSSQL_TCP_PORT: 1433
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./scripts/sql-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - secure-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
